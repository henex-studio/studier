# Model and effort allocation per role.
# See harness-core/docs/ai-harness-architecture.md Section 6 and decision-log.md H-2.1.
#
# Principle: judgement gets the strong model, volume gets the cheap one.
# The cost unit that matters under a subscription is allowance consumed per
# successfully completed task, not tokens per call. A weak model needing four
# attempts costs more than a strong model needing one, and leaves broken
# intermediate states that cost operator time to untangle.
#
# H-2.6: the frontmatter model field has previously been ignored, with subagents
# silently inheriting the parent model. Run each subagent once and read the model
# from the session output. Do not infer it from behaviour.
#
# H-2.4: when reducing cost, lower effort before lowering the model tier. A strong
# model at reduced effort keeps its knowledge and instruction-following. A weaker
# model loses both.

planner_model=opus
planner_effort=high

generator_model=sonnet
generator_effort=medium

evaluator_model=sonnet
evaluator_effort=medium

explorer_model=haiku
explorer_effort=low

reporter_model=haiku
reporter_effort=low

# Temporary ceiling when the weekly allowance is running low.
# Export CLAUDE_CODE_SUBAGENT_MODEL to force every subagent onto one model.
# Remove it afterwards. Leaving it set silently disables the whole allocation.
